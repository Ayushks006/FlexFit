<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Sign In')}"></head>
<body class="public-body auth-body">

<main class="auth-container">
    <div class="auth-brand-top">
        <a th:href="@{/}" class="brand-logo">
            <span class="brand-mark" aria-hidden="true">FF</span>
            <span class="brand-text">Flex<span>Fit</span></span>
        </a>
    </div>

    <section class="card auth-card">
        <div class="auth-card-header">
            <h1>Welcome back</h1>
            <p class="text-muted">Sign in to access your FlexFit dashboard and biometric profile.</p>
        </div>

        <div th:if="${param.logout}" class="alert alert-success" role="status">
            You have been signed out securely.
        </div>

        <div th:if="${errorMessage}" class="alert alert-error" role="alert" th:text="${errorMessage}">
            Invalid username or password
        </div>

        <form th:action="@{/login}" th:object="${loginRequest}" method="post" class="stack-form" novalidate>
            <div class="form-group">
                <label for="usernameOrEmail">Username or Email</label>
                <input id="usernameOrEmail" type="text" th:field="*{usernameOrEmail}"
                       placeholder="e.g. athlete_01 or you@example.com" autocomplete="username" required>
                <span class="field-error" th:if="${#fields.hasErrors('usernameOrEmail')}"
                      th:errors="*{usernameOrEmail}"></span>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div class="password-input-wrap">
                    <input id="password" type="password" th:field="*{password}"
                           placeholder="Enter your password" autocomplete="current-password" required>
                    <button type="button" class="toggle-password-btn" data-toggle-target="password"
                            aria-label="Toggle password visibility">Show</button>
                </div>
                <span class="field-error" th:if="${#fields.hasErrors('password')}"
                      th:errors="*{password}"></span>
            </div>

            <button type="submit" class="btn btn-primary btn-block btn-lg">Sign In</button>
        </form>

        <div class="auth-card-footer">
            <span class="text-muted">New to FlexFit?</span>
            <a th:href="@{/register}" class="link-accent">Create an account</a>
        </div>
    </section>
</main>

</body>
</html>
