<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title != null ? title + ' — FlexFit' : 'FlexFit'}">FlexFit</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/flexfit.css}">
    <script th:src="@{/js/flexfit.js}" defer></script>
</head>
<body>

<div th:fragment="appShell(content)" class="app-shell">
    <div class="sidebar-backdrop" id="sidebarBackdrop" aria-hidden="true"></div>

    <aside th:replace="~{fragments/sidebar :: sidebar}"></aside>

    <div class="app-main">
        <header th:replace="~{fragments/topbar :: topbar}"></header>

        <main class="app-content">
            <div th:replace="${content}"></div>
        </main>
    </div>

    <nav th:replace="~{fragments/mobile-nav :: mobileNav}"></nav>
</div>

</body>
</html>
