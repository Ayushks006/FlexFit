<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<aside th:fragment="sidebar" class="sidebar" id="appSidebar" aria-label="Primary Navigation">
    <div class="sidebar-header">
        <a th:href="@{/dashboard}" class="brand-logo">
            <span class="brand-mark" aria-hidden="true">FF</span>
            <span class="brand-text">Flex<span>Fit</span></span>
        </a>
        <button type="button" class="icon-btn mobile-only" id="sidebarCloseBtn" aria-label="Close navigation">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
        </button>
    </div>

    <nav class="sidebar-nav">
        <div class="nav-group-label">Overview</div>
        <a th:href="@{/dashboard}" class="nav-link" th:classappend="${activePage == 'dashboard'} ? ' active'">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="3" width="7" height="9" rx="1"></rect>
                <rect x="14" y="3" width="7" height="5" rx="1"></rect>
                <rect x="14" y="12" width="7" height="9" rx="1"></rect>
                <rect x="3" y="16" width="7" height="5" rx="1"></rect>
            </svg>
            <span>Dashboard</span>
        </a>
        <a th:href="@{/profile}" class="nav-link" th:classappend="${activePage == 'profile'} ? ' active'">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
            </svg>
            <span>Fitness Profile</span>
        </a>

        <div class="nav-group-label">Training Modules</div>
        <a th:href="@{/workouts}" class="nav-link" th:classappend="${activePage == 'workouts'} ? ' active'">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M6.5 6.5h11M6.5 17.5h11M4 10v4M20 10v4M8 7v10M16 7v10"></path>
            </svg>
            <span>Workouts</span>
        </a>
        <a th:href="@{/nutrition}" class="nav-link" th:classappend="${activePage == 'nutrition'} ? ' active'">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 2a7 7 0 0 0-7 7c0 5.25 7 13 7 13s7-7.75 7-13a7 7 0 0 0-7-7z"></path>
                <circle cx="12" cy="9" r="2.5"></circle>
            </svg>
            <span>Diet &amp; Nutrition</span>
        </a>
        <a th:href="@{/challenges}" class="nav-link" th:classappend="${activePage == 'challenges'} ? ' active'">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
            </svg>
            <span>Challenges</span>
        </a>
        <a th:href="@{/leaderboard}" class="nav-link" th:classappend="${activePage == 'leaderboard'} ? ' active'">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M8 21V11H4v10h4zM14 21V3h-4v18h4zM20 21v-7h-4v7h4z"></path>
            </svg>
            <span>Leaderboard</span>
        </a>

        <div class="nav-group-label">Account</div>
        <a th:href="@{/settings}" class="nav-link" th:classappend="${activePage == 'settings'} ? ' active'">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="3"></circle>
                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
            </svg>
            <span>Settings</span>
        </a>
    </nav>

    <div class="sidebar-footer">
        <div class="user-mini" th:if="${currentUser != null}">
            <div class="user-avatar" th:text="${#strings.substring(currentUser.fullName, 0, 1).toUpperCase()}">A</div>
            <div class="user-mini-meta">
                <div class="user-mini-name" th:text="${currentUser.fullName}">Athlete</div>
                <div class="user-mini-handle" th:text="'@' + ${currentUser.username}">@athlete</div>
            </div>
        </div>
        <form th:action="@{/logout}" method="post" class="logout-form">
            <button type="submit" class="btn btn-ghost btn-block logout-btn">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                    <polyline points="16 17 21 12 16 7"></polyline>
                    <line x1="21" y1="12" x2="9" y2="12"></line>
                </svg>
                <span>Sign Out</span>
            </button>
        </form>
    </div>
</aside>
</body>
</html>
